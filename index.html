  function updateSens(type, value) {
    let numVal = parseFloat(value); if (isNaN(numVal)) numVal = 0.0;
    numVal = Math.max(-5.0, Math.min(5.0, numVal));
    const rangeInput = document.getElementById(`input-${type}`); if (rangeInput) rangeInput.value = numVal;
    document.getElementById(`val-${type}`).innerText = numVal > 0 ? `+${numVal.toFixed(1)}` : numVal.toFixed(1);
    const activeIndex = Math.round((numVal + 5.0) / 0.5);
    for (let i = 0; i < 21; i++) {
      const block = document.getElementById(`block-${type}-${i}`);
      if (block) { if (i <= activeIndex) block.classList.add('active'); else block.classList.remove('active'); }
    }
  }

  function adjustSensStep(type, delta) {
    const rangeInput = document.getElementById(`input-${type}`);
    if (rangeInput) updateSens(type, (parseFloat(rangeInput.value) || 0.0) + delta);
  }

  // ==========================================================================
  // ドラッグ＆ドロップ機能
  // ==========================================================================
  let draggedSubEl = null;

  function initSubPowerDragDrop() {
    const parts = ['head', 'clothes', 'shoes'];
    parts.forEach(part => {
      for (let i = 0; i < 3; i++) {
        const subEl = document.getElementById(`${part}-sub${i}`);
        if (!subEl) continue;

        subEl.setAttribute('draggable', 'true');

        subEl.addEventListener('dragstart', (e) => {
          draggedSubEl = subEl;
          subEl.classList.add('sub-dragging');
          e.dataTransfer.setData('text/plain', subEl.id);
        });

        subEl.addEventListener('dragend', () => {
          if (draggedSubEl) draggedSubEl.classList.remove('sub-dragging');
          draggedSubEl = null;
          document.querySelectorAll('.sub-power-circle').forEach(el => el.classList.remove('sub-drag-over'));
        });

        subEl.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (draggedSubEl && draggedSubEl !== subEl && subEl.id.startsWith(part)) {
            subEl.classList.add('sub-drag-over');
          }
        });

        subEl.addEventListener('dragleave', () => {
          subEl.classList.remove('sub-drag-over');
        });

        subEl.addEventListener('drop', (e) => {
          e.preventDefault();
          subEl.classList.remove('sub-drag-over');
          if (draggedSubEl && draggedSubEl !== subEl && subEl.id.startsWith(part)) {
            swapSubPowers(draggedSubEl, subEl);
          }
        });

        subEl.addEventListener('touchstart', (e) => {
          draggedSubEl = subEl;
          subEl.classList.add('sub-dragging');
        }, { passive: true });

        subEl.addEventListener('touchmove', (e) => {
          if (!draggedSubEl) return;
          const touch = e.touches[0];
          const target = document.elementFromPoint(touch.clientX, touch.clientY);

          document.querySelectorAll('.sub-power-circle').forEach(el => el.classList.remove('sub-drag-over'));
          if (target && target.classList.contains('sub-power-circle') && target !== draggedSubEl && target.id.startsWith(part)) {
            target.classList.add('sub-drag-over');
          }
        }, { passive: true });

        subEl.addEventListener('touchend', (e) => {
          if (!draggedSubEl) return;
          const touch = e.changedTouches[0];
          const target = document.elementFromPoint(touch.clientX, touch.clientY);

          document.querySelectorAll('.sub-power-circle').forEach(el => {
            el.classList.remove('sub-drag-over', 'sub-dragging');
          });

          if (target && target.classList.contains('sub-power-circle') && target !== draggedSubEl && target.id.startsWith(part)) {
            swapSubPowers(draggedSubEl, target);
          }
          draggedSubEl = null;
        });
      }
    });
  }

  function swapSubPowers(el1, el2) {
    const name1 = el1.getAttribute('data-name') || "未選択";
    const img1 = el1.querySelector('img')?.getAttribute('src') || "";

    const name2 = el2.getAttribute('data-name') || "未選択";
    const img2 = el2.querySelector('img')?.getAttribute('src') || "";

    const part = el1.id.split('-')[0];
    const slotType1 = el1.id.split('-')[1];
    const slotType2 = el2.id.split('-')[1];

    selectPower(part, slotType1, name2, img2, true);
    selectPower(part, slotType2, name1, img1, true);
  }

  let draggedCardKey = null;

  function initSidebarSlotDragDrop() {
    const cards = document.querySelectorAll('.visual-slot-card');
    cards.forEach(card => {
      const key = card.id.replace('vcard-', '');
      card.setAttribute('draggable', 'true');

      card.addEventListener('dragstart', (e) => {
        draggedCardKey = key;
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', key);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        cards.forEach(c => c.classList.remove('drag-over'));
        draggedCardKey = null;
      });

      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (draggedCardKey && draggedCardKey !== key) {
          card.classList.add('drag-over');
        }
      });

      card.addEventListener('dragleave', () => {
        card.classList.remove('drag-over');
      });

      card.addEventListener('drop', (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        if (draggedCardKey && draggedCardKey !== key) {
          reorderSlots(draggedCardKey, key);
        }
      });

      card.addEventListener('touchstart', (e) => {
        draggedCardKey = key;
        card.classList.add('dragging');
      }, { passive: true });

      card.addEventListener('touchmove', (e) => {
        if (!draggedCardKey) return;
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetCard = target ? target.closest('.visual-slot-card') : null;

        document.querySelectorAll('.visual-slot-card').forEach(c => c.classList.remove('drag-over'));
        if (targetCard && targetCard.id !== `vcard-${draggedCardKey}`) {
          targetCard.classList.add('drag-over');
        }
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        if (!draggedCardKey) return;
        const touch = e.changedTouches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetCard = target ? target.closest('.visual-slot-card') : null;

        document.querySelectorAll('.visual-slot-card').forEach(c => c.classList.remove('drag-over', 'dragging'));

        if (targetCard) {
          const targetKey = targetCard.id.replace('vcard-', '');
          if (targetKey && targetKey !== draggedCardKey) {
            reorderSlots(draggedCardKey, targetKey);
          }
        }
        draggedCardKey = null;
      });
    });
  }

  function reorderSlots(draggedKey, targetKey) {
    const keys = Object.keys(slotNames);
    const dragIdx = keys.indexOf(draggedKey);
    const targetIdx = keys.indexOf(targetKey);

    if (dragIdx === -1 || targetIdx === -1) return;

    keys.splice(dragIdx, 1);
    keys.splice(targetIdx, 0, draggedKey);

    const newSlotNames = {};
    const newSlotsData = {};

    keys.forEach(k => {
      newSlotNames[k] = slotNames[k];
      newSlotsData[k] = slotsData[k];
    });

    slotNames = newSlotNames;
    slotsData = newSlotsData;

    saveAllToStorage();
    renderVisualSlots();
  }

  // ==========================================================================
  // 保存スロットデータ管理
  // ==========================================================================
  const STORAGE_KEY_SLOTS = 'spla3_closet_slots_dict_v7';
  const STORAGE_KEY_NAMES = 'spla3_closet_slot_names_v7';
  const STORAGE_KEY_ACTIVE = 'spla3_closet_active_key_v7';
  
  let currentActiveSlotKey = "";
  let slotNames = { "slot1": "マイコーデ1", "slot2": "マイコーデ2" };
  let slotsData = {};

  const defaultLayout = {
    weapon: { name: "未選択", image: "", subImage: "", spImage: "" },
    gear: {
      head: { name: "未選択", image: "", main: { name: "未選択", image: "" }, sub0: { name: "未選択", image: "" }, sub1: { name: "未選択", image: "" }, sub2: { name: "未選択", image: "" } },
      clothes: { name: "未選択", image: "", main: { name: "未選択", image: "" }, sub0: { name: "未選択", image: "" }, sub1: { name: "未選択", image: "" }, sub2: { name: "未選択", image: "" } },
      shoes: { name: "未選択", image: "", main: { name: "未選択", image: "" }, sub0: { name: "未選択", image: "" }, sub1: { name: "未選択", image: "" }, sub2: { name: "未選択", image: "" } }
    },
    sensitivity: { gyro: "0.0", stick: "0.0" },
    memo: ""
  };

  function initSlotSystem() {
    initTheme(); loadFavorites(); initSensMeters(); initModalScrollListener(); initSubPowerDragDrop();
    const savedNames = localStorage.getItem(STORAGE_KEY_NAMES);
    const savedSlots = localStorage.getItem(STORAGE_KEY_SLOTS);
    
    if (savedNames) slotNames = JSON.parse(savedNames);
    if (savedSlots) slotsData = JSON.parse(savedSlots);
    
    const keys = Object.keys(slotNames);
    if (keys.length === 0) { slotNames["slot1"] = "マイコーデ1"; }

    keys.forEach(k => { if(!slotsData[k]) slotsData[k] = JSON.parse(JSON.stringify(defaultLayout)); });

    currentActiveSlotKey = "";
    localStorage.removeItem(STORAGE_KEY_ACTIVE);

    renderVisualSlots();
    clearCurrentEditor();
  }

  function addNewSlot() {
    const newKey = "slot_" + Date.now();
    slotNames[newKey] = `マイコーデ${Object.keys(slotNames).length + 1}`;
    slotsData[newKey] = JSON.parse(JSON.stringify(defaultLayout));
    saveAllToStorage(); switchSlot(newKey);
    showToast("➕ 新しいコーデを追加しました");
  }

  function renderImgOrText(dataObj, defaultChar = "?") {
    if (!dataObj || dataObj.name === "未選択" || dataObj.name === "-" || !dataObj.image) return defaultChar;
    return `<img src="${dataObj.image}" loading="lazy">`;
  }

  function renderVisualSlots() {
    const wrapper = document.getElementById('slots-wrapper'); wrapper.innerHTML = "";
    Object.keys(slotNames).forEach(key => {
      const data = slotsData[key] || defaultLayout;
      const card = document.createElement('div');
      card.className = `visual-slot-card ${key === currentActiveSlotKey ? 'active' : ''}`;
      card.id = `vcard-${key}`; card.setAttribute('onclick', `switchSlot('${key}')`);
      card.innerHTML = `
        <div class="slot-meta"><div class="slot-name" title="${slotNames[key]}">${slotNames[key]}</div></div>
        <div class="slot-preview-weapon-row"><div class="slot-preview-weapon-icon">${renderImgOrText(data.weapon, "?")}</div><div class="slot-preview-weapon-name">${data.weapon.name}</div></div>
        <div class="slot-card-actions" onclick="event.stopPropagation()">
          <button class="mini-btn mini-btn-save" onclick="saveSlotData('${key}')" title="保存" aria-label="保存">💾</button>
          <button class="mini-btn mini-btn-clone" onclick="duplicateSlotData('${key}', event)" title="複製" aria-label="複製">📋</button>
          <button class="mini-btn mini-btn-edit" onclick="renameSlotData('${key}')" title="名前変更" aria-label="名前変更">✏️</button>
          <button class="mini-btn mini-btn-delete" onclick="deleteSlotData('${key}')" title="削除" aria-label="削除">🗑️</button>
        </div>`;
      wrapper.appendChild(card);
    });

    initSidebarSlotDragDrop();
  }

  function switchSlot(key) {
    // 切替直前に現在の画面状態をバックアップ
    backupCurrentEditorState();

    currentActiveSlotKey = key;
    localStorage.setItem(STORAGE_KEY_ACTIVE, key);
    renderVisualSlots();
    applySlotData(key);

    showToast("コーデを切り替えました（↺直前復元可能）");
  }

  function applySlotData(slotKey) {
    const data = slotsData[slotKey] || defaultLayout;
    selectWeapon(data.weapon.name, data.weapon.image, data.weapon.subImage, data.weapon.spImage);
    ['head', 'clothes', 'shoes'].forEach(part => {
      const gPart = data.gear[part]; selectGear(part, gPart.name, gPart.image, false);
      ['main', 'sub0', 'sub1', 'sub2'].forEach(slot => { selectPower(part, slot, gPart[slot].name, gPart[slot].image, false); });
    });
    updateSens('gyro', data.sensitivity.gyro); updateSens('stick', data.sensitivity.stick);
    document.getElementById('input-memo').value = data.memo || "";
    calculateAndRenderGearTotals();
  }

  function getSlotElementData(elementId) {
    const el = document.getElementById(elementId);
    const name = el ? (el.getAttribute('data-name') || "未選択") : "未選択";
    const imgEl = el ? el.querySelector('img') : null;
    return { name, image: imgEl ? imgEl.getAttribute('src') : "" };
  }

  function getWeaponSlotElementData() {
    const el = document.getElementById('slot-weapon');
    const name = el ? (el.getAttribute('data-name') || "未選択") : "未選択";
    const imgEl = el ? el.querySelector('.image-placeholder img') : null;
    return { name, image: imgEl ? imgEl.getAttribute('src') : "", subImage: el ? (el.getAttribute('data-sub-image') || "") : "", spImage: el ? (el.getAttribute('data-sp-image') || "") : "" };
  }

  function saveSlotData(slotKey) {
    slotsData[slotKey] = {
      weapon: getWeaponSlotElementData(),
      gear: { head: getGearPartData('head'), clothes: getGearPartData('clothes'), shoes: getGearPartData('shoes') },
      sensitivity: { gyro: document.getElementById('input-gyro').value, stick: document.getElementById('input-stick').value },
      memo: document.getElementById('input-memo').value
    };
    saveAllToStorage(); renderVisualSlots();
    showToast(`💾 「${slotNames[slotKey]}」に保存しました！`);
  }

  function duplicateSlotData(slotKey, event) {
    if (event) event.stopPropagation();

    const sourceData = slotsData[slotKey];
    if (!sourceData) return;

    const newKey = "slot_" + Date.now();
    const originalName = slotNames[slotKey] || "マイコーデ";
    slotNames[newKey] = `${originalName} (コピー)`;

    slotsData[newKey] = JSON.parse(JSON.stringify(sourceData));

    saveAllToStorage();
    switchSlot(newKey);
    showToast("📋 コーデを複製しました");
  }

  function getGearPartData(part) {
    const gearData = getSlotElementData(`slot-${part}`);
    return {
      name: gearData.name, image: gearData.image,
      main: getSlotElementData(`${part}-main`), sub0: getSlotElementData(`${part}-sub0`), sub1: getSlotElementData(`${part}-sub1`), sub2: getSlotElementData(`${part}-sub2`)
    };
  }

  function renameSlotData(slotKey) {
    const newName = prompt("新しいコーデ名を入力してください：", slotNames[slotKey]);
    if (newName && newName.trim() !== "") {
      slotNames[slotKey] = newName.trim();
      saveAllToStorage();
      renderVisualSlots();
      showToast("✏️ 名前を変更しました");
    }
  }

  function deleteSlotData(slotKey) {
    if (Object.keys(slotNames).length <= 1) { showToast("❌ 最低1つのスロットが必要です"); return; }
    if (confirm(`⚠️ 「${slotNames[slotKey]}」を削除しますか？`)) {
      delete slotNames[slotKey]; delete slotsData[slotKey]; saveAllToStorage();
      if (slotKey === currentActiveSlotKey) {
        currentActiveSlotKey = "";
        localStorage.removeItem(STORAGE_KEY_ACTIVE);
        clearCurrentEditor();
      }
      renderVisualSlots();
      showToast("🗑️ コーデを削除しました");
    }
  }

  function saveAllToStorage() {
    localStorage.setItem(STORAGE_KEY_NAMES, JSON.stringify(slotNames));
    localStorage.setItem(STORAGE_KEY_SLOTS, JSON.stringify(slotsData));
  }

  window.addEventListener('DOMContentLoaded', initSlotSystem);
</script>

</body>
</html>
