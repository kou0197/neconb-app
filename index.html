<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイコーデエディタ</title>
  <!-- html2canvas (要素を画像保存するためのライブラリ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ==========================================================================
       全体スタイル（CSS変数によるテーマ管理）
       ========================================================================== */
    :root {
      --bg-color: #121317;
      --card-bg: #1c1d22;
      --panel-bg: #24262f;
      --text-color: #f5f5f7;
      --text-muted: #8e8f9c;
      --splat-yellow: #eaff00;
      --splat-purple: #9800ff;
      --border-color: #31333e;
      --accent-blue: #0088cc;
      --danger-red: #ff3366;
      --success-green: #28a745;
      --input-bg: #121317;
      --preview-box-bg: rgba(18, 19, 23, 0.6);
      --gear-row-bg: rgba(42, 44, 53, 0.3);
    }

    [data-theme="light"] {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --panel-bg: #e4e7eb;
      --text-color: #1a1a1a;
      --text-muted: #65676b;
      --splat-yellow: #d35f12;
      --splat-purple: #7000bc;
      --border-color: #cccccc;
      --accent-blue: #0088cc;
      --danger-red: #e60033;
      --success-green: #1b8a3e;
      --input-bg: #ffffff;
      --preview-box-bg: rgba(230, 233, 238, 0.8);
      --gear-row-bg: rgba(220, 224, 230, 0.6);
    }

    @font-face {
      font-family: 'Tanugo';
      src: url('./Tanugo-Bold.otf') format('opentype');
      font-weight: normal;
      font-display: swap;
    }

    * {
      font-family: 'Tanugo', sans-serif !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      padding-bottom: 60px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.no-scroll {
      overflow: hidden !important;
      height: 100vh !important;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* トースト通知 */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background-color: var(--card-bg);
      border: 2px solid var(--splat-yellow);
      color: var(--text-color);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      pointer-events: auto;
    }

    .toast.toast-out {
      animation: toastOut 0.3s ease forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-20px) scale(0.9); }
    }

    .app-title-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    h1 {
      text-align: center;
      color: var(--splat-yellow);
      text-shadow: 3px 3px 0px var(--splat-purple);
      font-style: italic;
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    .app-wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .sidebar {
      width: 250px;
      flex-shrink: 0;
    }

    .main-content {
      flex-grow: 1;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .section-title {
      font-size: 1rem;
      color: var(--splat-yellow);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }

    /* 復元ボタンのスタイル追加 */
    .restore-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .restore-btn:hover {
      background: var(--accent-blue);
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 136, 204, 0.4);
    }

    .reset-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--danger-red);
      color: var(--danger-red);
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .reset-btn:hover {
      background: var(--danger-red);
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
    }

    .export-img-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--splat-yellow);
      color: var(--splat-yellow);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .export-img-btn:hover {
      background: var(--splat-yellow);
      color: var(--bg-color);
      box-shadow: 0 0 10px rgba(234, 255, 0, 0.4);
    }

    .dropdown {
      position: relative;
    }

    .icon-menu-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-color);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .icon-menu-btn:hover {
      border-color: var(--splat-yellow);
      color: var(--splat-yellow);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 38px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      z-index: 100;
      min-width: 170px;
      overflow: hidden;
    }

    .dropdown-menu.show {
      display: block;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dropdown-menu button {
      width: 100%;
      padding: 10px 14px;
      background: none;
      border: none;
      color: var(--text-color);
      text-align: left;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .dropdown-menu button:hover {
      background: var(--panel-bg);
      color: var(--splat-yellow);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border-color);
    }

    .add-slot-icon-btn {
      background: var(--panel-bg);
      border: 1.5px solid var(--splat-yellow);
      color: var(--splat-yellow);
      width: 60px;
      height: 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      line-height: 1;
      margin-right: 0;
      padding: 0 8px;
      flex-shrink: 0;
    }
    .add-slot-icon-btn:hover {
      background: var(--splat-yellow);
      color: var(--bg-color);
      box-shadow: 0 0 8px rgba(234, 255, 0, 0.4);
    }

    .slots-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 80vh;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--splat-yellow) var(--card-bg);
    }

    .slots-container::-webkit-scrollbar { width: 6px; }
    .slots-container::-webkit-scrollbar-track { background: var(--card-bg); border-radius: 10px; }
    .slots-container::-webkit-scrollbar-thumb { background: var(--splat-yellow); border-radius: 10px; }

    .visual-slot-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      cursor: grab;
      position: relative;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      width: 100%;
      box-sizing: border-box;
      user-select: none;
      touch-action: manipulation;
    }
    .visual-slot-card:active {
      cursor: grabbing;
    }
    .visual-slot-card.dragging {
      opacity: 0.4;
      border-style: dashed;
    }
    .visual-slot-card.drag-over {
      border-color: var(--splat-yellow);
      transform: scale(1.02);
    }

    .visual-slot-card.active {
      border-color: var(--splat-yellow);
      box-shadow: 0 0 10px rgba(234, 255, 0, 0.2);
    }

    .slot-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .slot-name {
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--splat-yellow);
    }

    .slot-preview-weapon-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    
    .slot-preview-weapon-icon {
      font-size: 1.5rem;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border-radius: 6px;
      flex-shrink: 0;
      padding: 2px;
    }
    .slot-preview-weapon-name {
      font-size: 0.8rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-color);
    }

    .slot-card-actions { display: flex; gap: 6px; margin-top: 2px; }

    .mini-btn {
      flex: 1;
      height: 28px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .mini-btn-save { background: var(--splat-purple); border-color: var(--splat-purple); color: #fff; }
    .mini-btn-save:hover { opacity: 0.9; }
    .mini-btn-clone { color: var(--text-muted); }
    .mini-btn-clone:hover { color: var(--splat-yellow); border-color: var(--splat-yellow); }
    .mini-btn-edit { color: var(--text-muted); }
    .mini-btn-edit:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .mini-btn-delete { color: var(--text-muted); }
    .mini-btn-delete:hover { color: var(--danger-red); border-color: var(--danger-red); }

    .capture-area {
      background-color: var(--bg-color);
      padding: 10px;
      border-radius: 12px;
    }

    .coord-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .slot-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
      position: relative;
    }

    .clear-part-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      z-index: 10;
    }
    .clear-part-btn:hover {
      color: var(--danger-red);
      border-color: var(--danger-red);
      background: var(--card-bg);
      transform: scale(1.15);
    }

    .memo-clear-btn {
      top: 0px !important;
      right: 0px !important;
    }

    .clickable-slot { cursor: pointer; }
    .clickable-slot:hover {
      border-color: var(--splat-yellow);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .slot-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .save-mygear-btn {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--splat-yellow);
      color: var(--splat-yellow);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.15s;
    }
    .save-mygear-btn:hover {
      background: var(--splat-yellow);
      color: var(--bg-color);
    }

    .image-placeholder {
      width: 80px;
      height: 80px;
      background: var(--input-bg);
      margin: 0 auto 12px auto;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .selected-name {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 10px;
      min-height: 1.2em;
      color: var(--text-muted);
    }
    .selected-name.active-selection { color: var(--text-color); }

    .weapon-sub-special-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
      margin-top: 5px;
    }

    .sub-sp-icon-circle {
      width: 38px;
      height: 38px;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      overflow: hidden;
      flex-shrink: 0;
    }

    .gear-power-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-top: 1px dashed var(--border-color);
      padding-top: 15px;
    }

    .main-power-circle {
      width: 46px;
      height: 46px;
      background: var(--input-bg);
      border: 1.5px dashed var(--accent-blue);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      color: var(--text-muted);
      transition: background 0.2s, transform 0.2s;
    }
    .main-power-circle:hover { transform: scale(1.08); background: var(--card-bg); }

    .sub-powers-row { display: flex; gap: 6px; }

    .sub-power-circle {
      width: 30px;
      height: 30px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: grab;
      color: var(--text-muted);
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
      user-select: none;
      touch-action: none;
    }
    .sub-power-circle:active { cursor: grabbing; }
    .sub-power-circle:hover { transform: scale(1.1); background: var(--card-bg); }
    .sub-power-circle.sub-drag-over {
      border-color: var(--splat-yellow);
      background: var(--panel-bg);
      transform: scale(1.25);
    }
    .sub-power-circle.sub-dragging {
      opacity: 0.3;
    }

    .gear-total-section {
      margin-bottom: 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .gear-total-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: bold;
      margin-bottom: 8px;
    }
    .gear-total-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
    }
    .gear-total-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }
    .gear-total-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--input-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .gear-total-value {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--splat-yellow);
    }
    .empty-totals-msg {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .meta-panel {
      background-color: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .memo-container {
      position: relative;
    }

    .sens-row { margin-bottom: 16px; }
    .sens-row label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    
    .sens-controls-wrapper { display: flex; align-items: center; gap: 8px; }

    .sens-arrow-btn {
      width: 28px;
      height: 28px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--splat-yellow);
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .sens-arrow-btn:hover { border-color: var(--splat-yellow); }
    .sens-arrow-btn:active { transform: scale(0.9); }

    .sens-meter-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sens-numbers-wrapper {
      display: flex;
      width: 100%;
      justify-content: space-between;
    }

    .sens-num-step {
      font-size: 0.65rem;
      color: var(--text-muted);
      width: 0;
      display: flex;
      justify-content: center;
      user-select: none;
    }

    .sens-blocks-wrapper {
      width: 100%;
      height: 16px;
      display: flex;
      gap: 3px;
      background: var(--input-bg);
      padding: 3px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .sens-block {
      flex: 1;
      height: 100%;
      background: var(--panel-bg);
      border-radius: 1px;
      transition: background-color 0.1s;
    }

    .sens-block.active {
      background-color: var(--splat-yellow);
      box-shadow: 0 0 4px rgba(234, 255, 0, 0.4);
    }

    .sens-range-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 16px;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    .sens-value {
      font-weight: bold;
      font-size: 1.1rem;
      width: 44px;
      text-align: right;
      color: var(--splat-yellow);
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      height: 110px;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      resize: vertical;
    }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .app-wrapper { flex-direction: column; gap: 12px; }
      .sidebar { width: 100%; }
      .main-content { width: 100%; }
      .slots-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        max-height: 220px;
        padding-right: 2px;
      }
      .slot-preview-weapon-name { display: none; }
      .slot-preview-weapon-row { justify-content: center; padding: 4px; }
      .slot-preview-weapon-icon { width: 36px; height: 36px; }
      
      .coord-grid { 
        grid-template-columns: repeat(2, 1fr); 
        gap: 8px; 
        margin-bottom: 12px; 
      }
      .slot-card { padding: 10px 6px; }
      .image-placeholder { width: 60px; height: 60px; font-size: 1.8rem; margin-bottom: 6px; }
      .selected-name { font-size: 0.8rem; margin-bottom: 6px; }
      
      .meta-panel { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
      .modal-window { width: 95%; max-height: 92vh; }
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      touch-action: none;
    }

    .modal-window {
      background: var(--panel-bg);
      border: 3px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: popIn 0.35s cubic-bezier(0.12, 1, 0.2, 1);
      overflow: hidden;
      will-change: transform, opacity;
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-window.modal-slide-left {
      animation: modalSlideLeft 0.75s cubic-bezier(0.12, 1, 0.15, 1) forwards;
    }

    .modal-window.modal-slide-right {
      animation: modalSlideRight 0.75s cubic-bezier(0.12, 1, 0.15, 1) forwards;
    }

    @keyframes modalSlideLeft {
      from { opacity: 0.1; transform: translateX(90px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes modalSlideRight {
      from { opacity: 0.1; transform: translateX(-90px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .modal-window-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      overflow: hidden;
      will-change: transform, opacity;
    }

    .modal-window-content.content-fade-in {
      animation: modalContentFadeIn 0.8s cubic-bezier(0.12, 1, 0.15, 1) forwards;
    }

    @keyframes modalContentFadeIn {
      from {
        opacity: 0.1;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .modal-header-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }

    .modal-nav-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-step-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--splat-yellow);
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .nav-step-btn:hover {
      border-color: var(--splat-yellow);
      background: var(--panel-bg);
    }

    .back-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      transition: background 0.15s, border-color 0.15s;
    }
    .back-btn:hover { border-color: var(--splat-yellow); }

    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--splat-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0 4px; }
    .close-btn:hover { color: var(--text-color); }

    .search-input-box {
      width: 100%;
      margin-top: 8px;
      position: relative;
    }
    .search-input-box input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-color);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input-box input:focus {
      border-color: var(--splat-yellow);
    }

    .filter-toggle-btn {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--splat-yellow);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      margin-bottom: 4px;
    }
    .filter-toggle-btn:hover { border-color: var(--splat-yellow); }
    .filter-toggle-btn .arrow { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .filter-toggle-btn.open .arrow { transform: rotate(180deg); }

    .active-filter-summary {
      font-size: 0.75rem;
      color: var(--accent-blue);
      font-weight: normal;
      margin-left: 6px;
    }

    .modal-filter-box {
      padding: 10px 20px 0 20px;
      display: flex;
      flex-direction: column;
    }

    .quick-access-bar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .quick-access-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 2px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .quick-access-btn:hover { border-color: var(--splat-yellow); transform: translateY(-1px); }
    .quick-access-btn.active {
      border-color: var(--splat-yellow);
      background: var(--panel-bg);
      color: var(--splat-yellow);
      box-shadow: 0 0 8px rgba(234, 255, 0, 0.3);
    }
    .quick-access-btn.btn-all { color: var(--text-color); }
    .quick-access-btn.btn-all:hover, .quick-access-btn.btn-all.active { border-color: var(--splat-yellow); color: var(--splat-yellow); }
    .quick-access-btn.btn-mygear { color: var(--success-green); }
    .quick-access-btn.btn-mygear:hover, .quick-access-btn.btn-mygear.active { border-color: var(--success-green); color: var(--success-green); }
    .quick-access-btn.btn-fav { color: var(--splat-yellow); }
    .quick-access-btn.btn-fav:hover, .quick-access-btn.btn-fav.active { border-color: var(--splat-yellow); color: var(--splat-yellow); }
    .quick-access-btn.btn-recent { color: var(--accent-blue); }
    .quick-access-btn.btn-recent:hover, .quick-access-btn.btn-recent.active { border-color: var(--accent-blue); color: var(--accent-blue); }

    .filter-collapsible-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .filter-collapsible-wrapper.open { grid-template-rows: 1fr; }

    .filter-collapsible-inner {
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.25s ease, padding 0.35s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 0;
      padding-bottom: 0;
    }
    .filter-collapsible-wrapper.open .filter-collapsible-inner {
      opacity: 1;
      padding-top: 6px;
      padding-bottom: 4px;
    }

    .filter-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .gear-power-filter-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      max-height: none !important;
      overflow-y: visible !important;
      justify-content: flex-start;
      align-items: center;
    }

    .power-filter-btn {
      width: 36px;
      height: 36px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
      position: relative;
      font-size: 0.65rem;
      font-weight: bold;
      color: var(--text-muted);
    }
    .power-filter-btn:hover { transform: scale(1.1); border-color: var(--splat-yellow); }
    .power-filter-btn.active {
      border-color: var(--splat-yellow);
      background: var(--panel-bg);
      box-shadow: 0 0 10px rgba(234, 255, 0, 0.6);
      transform: scale(1.1);
    }
    .power-filter-btn img { width: 85%; height: 80%; object-fit: contain; }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .selection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }

    .grid-item-tile {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 8px 8px 8px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .grid-item-tile:hover { border-color: var(--splat-yellow); }

    .fav-star-btn {
      position: absolute;
      top: 4px; right: 6px;
      font-size: 1.1rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s, transform 0.15s;
      z-index: 2;
    }
    .fav-star-btn:hover { transform: scale(1.2); }
    .fav-star-btn.is-fav { color: var(--splat-yellow); }

    .delete-mygear-tile-btn {
      position: absolute;
      top: 4px; right: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      z-index: 2;
      transition: color 0.15s;
    }
    .delete-mygear-tile-btn:hover { color: var(--danger-red); }

    .tile-icon {
      font-size: 1.8rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 50px;
    }

    .tile-name {
      font-size: 0.75rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-sub-sp-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
      background: var(--input-bg);
      padding: 3px 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    .tile-sub-sp-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: var(--text-muted);
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
    }

    .tile-powers-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-top: 6px;
      background: var(--input-bg);
      padding: 3px 6px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .tile-power-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.6rem;
      background: var(--card-bg);
      color: var(--text-muted);
      flex-shrink: 0;
      overflow: hidden;
    }

    .tile-power-circle.main {
      width: 20px;
      height: 20px;
      border: 1.5px dashed var(--accent-blue);
    }

    .tile-power-circle.sub {
      width: 15px;
      height: 15px;
      border: 1px solid var(--border-color);
    }

    .empty-fav-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .image-placeholder img,
    .slot-preview-weapon-icon img,
    .mini-gear-icon img,
    .mini-power-circle img,
    .main-power-circle img,
    .sub-power-circle img,
    .sub-sp-icon-circle img,
    .tile-icon img,
    .gear-total-icon img,
    .tile-power-circle img,
    .tile-sub-sp-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: inherit;
    }

    .sub-sp-icon-circle { width: 52px !important; height: 52px !important; }
    .main-power-circle { width: 58px !important; height: 58px !important; font-size: 1.6rem !important; }
    .sub-powers-row { gap: 8px !important; }
    .sub-power-circle { width: 40px !important; height: 40px !important; font-size: 1rem !important; }
    .gear-total-icon { width: 34px !important; height: 34px !important; }
    .gear-total-value { font-size: 1.05rem !important; }
    .power-filter-btn { width: 44px !important; height: 44px !important; }
    .tile-power-circle.main { width: 26px !important; height: 26px !important; }
    .tile-power-circle.sub { width: 20px !important; height: 20px !important; }
    .tile-sub-sp-circle { width: 24px !important; height: 24px !important; }
  </style>
</head>
<body>

<!-- トースト表示領域 -->
<div class="toast-container" id="toast-container"></div>

<div class="container">
  <div class="app-wrapper">
    <!-- サイドバー：保存コーデ -->
    <div class="sidebar">
      <div class="section-header">
        <div class="section-title">保存済コーデ</div>
        <button class="add-slot-icon-btn" onclick="addNewSlot()" title="コーデを追加" aria-label="コーデを追加">✚</button>
      </div>
      <div class="slots-container" id="slots-wrapper"></div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content">
      <div class="section-header">
        <div class="section-title">現在の編成</div>
        <div class="header-actions">
          <!-- 復元ボタン・リセットボタン・画像保存ボタン -->
          <button class="restore-btn" onclick="restoreUnsavedState()" title="保存せずに切替・クリアした直前の状態に戻す">↺ 直前復元</button>
          <button class="reset-btn" onclick="resetCurrent編成()" title="現在の編成をすべてクリア">🔄 リセット</button>
          <button class="export-img-btn" onclick="exportAsImage()">📷 画像保存</button>
          
          <!-- サブ機能・設定 -->
          <div class="dropdown">
            <button class="icon-menu-btn" onclick="toggleHeaderMenu(event)" title="メニュー">⋮</button>
            <div class="dropdown-menu" id="header-dropdown">
              <button onclick="toggleTheme()"><span id="theme-icon">🌙</span> <span id="theme-label">ライトモード</span></button>
              <div class="dropdown-divider"></div>
              <button onclick="exportDataAsJSON(); closeHeaderMenu();">📥 バックアップ</button>
              <button onclick="importDataFromJSON(); closeHeaderMenu();">📤 復元</button>
            </div>
          </div>

          <input type="file" id="json-file-input" accept=".json" style="display:none" onchange="handleJSONFileSelect(event)">
        </div>
      </div>
      
      <div class="capture-area" id="capture-target">
        <div class="coord-grid">
          <!-- ブキ -->
          <div class="slot-card" id="slot-weapon" data-name="未選択" data-sub-image="" data-sp-image="">
            <button class="clear-part-btn" onclick="clearWeaponPart(event)" title="ブキをクリア" aria-label="ブキをクリア">✕</button>
            <div class="clickable-slot" onclick="openWeaponCategoryModal()">
              <div class="slot-title">ブキ</div>
              <div class="image-placeholder" id="display-weapon-icon">?</div>
              <div class="selected-name" id="display-weapon-name">未選択</div>
            </div>
            
            <div class="weapon-sub-special-box">
              <div class="sub-sp-icon-circle" id="display-weapon-sub" title="サブウェポン">-</div>
              <div class="sub-sp-icon-circle" id="display-weapon-sp" title="スペシャルウェポン">-</div>
            </div>
          </div>

          <!-- アタマ -->
          <div class="slot-card" id="slot-head" data-name="未選択">
            <button class="clear-part-btn" onclick="clearGearPart('head', event)" title="アタマをクリア" aria-label="アタマをクリア">✕</button>
            <div class="clickable-slot" onclick="openGearBrandModal('head')">
              <div class="slot-title">アタマ</div>
              <div class="image-placeholder" id="display-head-icon">?</div>
              <div class="selected-name" id="display-head-name">未選択</div>
            </div>
            <div class="gear-power-box">
              <div class="main-power-circle" id="head-main" onclick="openPowerModal('head', 'main')" data-name="未選択" title="メインパワー">?</div>
              <div class="sub-powers-row">
                <div class="sub-power-circle" id="head-sub0" onclick="openPowerModal('head', 'sub0')" data-name="未選択" title="サブパワー1">-</div>
                <div class="sub-power-circle" id="head-sub1" onclick="openPowerModal('head', 'sub1')" data-name="未選択" title="サブパワー2">-</div>
                <div class="sub-power-circle" id="head-sub2" onclick="openPowerModal('head', 'sub2')" data-name="未選択" title="サブパワー3">-</div>
              </div>
            </div>
            <button class="save-mygear-btn" onclick="saveCurrentGearAsMyGear('head')" title="現在の構成をマイギアに保存">＋ マイギア登録</button>
          </div>

          <!-- フク -->
          <div class="slot-card" id="slot-clothes" data-name="未選択">
            <button class="clear-part-btn" onclick="clearGearPart('clothes', event)" title="フクをクリア" aria-label="フクをクリア">✕</button>
            <div class="clickable-slot" onclick="openGearBrandModal('clothes')">
              <div class="slot-title">フク</div>
              <div class="image-placeholder" id="display-clothes-icon">?</div>
              <div class="selected-name" id="display-clothes-name">未選択</div>
            </div>
            <div class="gear-power-box">
              <div class="main-power-circle" id="clothes-main" onclick="openPowerModal('clothes', 'main')" data-name="未選択" title="メインパワー">?</div>
              <div class="sub-powers-row">
                <div class="sub-power-circle" id="clothes-sub0" onclick="openPowerModal('clothes', 'sub0')" data-name="未選択" title="サブパワー1">-</div>
                <div class="sub-power-circle" id="clothes-sub1" onclick="openPowerModal('clothes', 'sub1')" data-name="未選択" title="サブパワー2">-</div>
                <div class="sub-power-circle" id="clothes-sub2" onclick="openPowerModal('clothes', 'sub2')" data-name="未選択" title="サブパワー3">-</div>
              </div>
            </div>
            <button class="save-mygear-btn" onclick="saveCurrentGearAsMyGear('clothes')" title="現在の構成をマイギアに保存">＋ マイギア登録</button>
          </div>

          <!-- クツ -->
          <div class="slot-card" id="slot-shoes" data-name="未選択">
            <button class="clear-part-btn" onclick="clearGearPart('shoes', event)" title="クツをクリア" aria-label="クツをクリア">✕</button>
            <div class="clickable-slot" onclick="openGearBrandModal('shoes')">
              <div class="slot-title">クツ</div>
              <div class="image-placeholder" id="display-shoes-icon">?</div>
              <div class="selected-name" id="display-shoes-name">未選択</div>
            </div>
            <div class="gear-power-box">
              <div class="main-power-circle" id="shoes-main" onclick="openPowerModal('shoes', 'main')" data-name="未選択" title="メインパワー">?</div>
              <div class="sub-powers-row">
                <div class="sub-power-circle" id="shoes-sub0" onclick="openPowerModal('shoes', 'sub0')" data-name="未選択" title="サブパワー1">-</div>
                <div class="sub-power-circle" id="shoes-sub1" onclick="openPowerModal('shoes', 'sub1')" data-name="未選択" title="サブパワー2">-</div>
                <div class="sub-power-circle" id="shoes-sub2" onclick="openPowerModal('shoes', 'sub2')" data-name="未選択" title="サブパワー3">-</div>
              </div>
            </div>
            <button class="save-mygear-btn" onclick="saveCurrentGearAsMyGear('shoes')" title="現在の構成をマイギアに保存">＋ マイギア登録</button>
          </div>
        </div>

        <div class="meta-panel">
          <div>
            <div class="gear-total-section">
              <div class="gear-total-title">ギアパワー合計</div>
              <div class="gear-total-list" id="gear-totals-wrapper">
                <span class="empty-totals-msg">ギアパワーが選択されていません</span>
              </div>
            </div>

            <!-- ジャイロ感度 -->
            <div class="sens-row">
              <label>ジャイロ感度</label>
              <div class="sens-controls-wrapper">
                <button class="sens-arrow-btn" onclick="adjustSensStep('gyro', -0.5)">◀</button>
                <div class="sens-meter-container">
                  <div class="sens-numbers-wrapper">
                    <span class="sens-num-step">-5</span><span class="sens-num-step">-4</span><span class="sens-num-step">-3</span><span class="sens-num-step">-2</span><span class="sens-num-step">-1</span><span class="sens-num-step">0</span><span class="sens-num-step">+1</span><span class="sens-num-step">+2</span><span class="sens-num-step">+3</span><span class="sens-num-step">+4</span><span class="sens-num-step">+5</span>
                  </div>
                  <div class="sens-blocks-wrapper" id="blocks-gyro"></div>
                  <input type="range" class="sens-range-overlay" id="input-gyro" min="-5.0" max="5.0" step="0.5" value="0.0" oninput="updateSens('gyro', this.value)">
                </div>
                <button class="sens-arrow-btn" onclick="adjustSensStep('gyro', 0.5)">▶</button>
                <div class="sens-value" id="val-gyro">0.0</div>
              </div>
            </div>

            <!-- スティック感度 -->
            <div class="sens-row">
              <label>スティック感度</label>
              <div class="sens-controls-wrapper">
                <button class="sens-arrow-btn" onclick="adjustSensStep('stick', -0.5)">◀</button>
                <div class="sens-meter-container">
                  <div class="sens-numbers-wrapper">
                    <span class="sens-num-step">-5</span><span class="sens-num-step">-4</span><span class="sens-num-step">-3</span><span class="sens-num-step">-2</span><span class="sens-num-step">-1</span><span class="sens-num-step">0</span><span class="sens-num-step">+1</span><span class="sens-num-step">+2</span><span class="sens-num-step">+3</span><span class="sens-num-step">+4</span><span class="sens-num-step">+5</span>
                  </div>
                  <div class="sens-blocks-wrapper" id="blocks-stick"></div>
                  <input type="range" class="sens-range-overlay" id="input-stick" min="-5.0" max="5.0" step="0.5" value="0.0" oninput="updateSens('stick', this.value)">
                </div>
                <button class="sens-arrow-btn" onclick="adjustSensStep('stick', 0.5)">▶</button>
                <div class="sens-value" id="val-stick">0.0</div>
              </div>
            </div>
          </div>

          <div class="memo-container">
            <button class="clear-part-btn memo-clear-btn" onclick="clearMemoText(event)" title="メモをクリア" aria-label="メモをクリア">✕</button>
            <label style="display:block; font-size:0.9rem; color:var(--text-muted); margin-bottom:6px;">メモ・コメント</label>
            <textarea id="input-memo" placeholder="例: ガチホコ用 / 立ち回りメモ：初動は右高取り、ホコ持ち意識"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- モーダル -->

          <button class="nav-step-btn" onclick="navigateModalPart(-1)" title="前へ">◀ </button>

      <div class="modal-filter-box" id="modal-filter-container" style="display: none;">

        <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilterCollapse()">

              <div id="filter-cat-bar" class="gear-power-filter-bar"></div>
            </div>

              <div class="filter-label">サブウェポン</div>
              <div id="filter-sub-bar" class="gear-power-filter-bar"></div>

            <div id="filter-sp-container" style="display: none;">
              <div class="filter-label">スペシャルウェポン</div>
              <div id="filter-sp-bar" class="gear-power-filter-bar"></div>

            <div id="filter-brand-container" style="display: none;">
              <div class="filter-label">ブランド</div>

<script>
  // ==========================================================================
  // ヘッダードロップダウンメニュー
  // ==========================================================================
  function toggleHeaderMenu(event) {
    if (event) event.stopPropagation();
    const dropdown = document.getElementById('header-dropdown');
    if (dropdown) dropdown.classList.toggle('show');
  }

  function closeHeaderMenu() {
    const dropdown = document.getElementById('header-dropdown');
    if (dropdown && dropdown.classList.contains('show')) {
      dropdown.classList.remove('show');
    }
  }

  window.addEventListener('click', function(e) {
    if (!e.target.matches('.icon-menu-btn')) {
      closeHeaderMenu();
    }
  });

  // ==========================================================================
  // トースト通知機能
  // ==========================================================================
  function showToast(message) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = message;

    container.appendChild(toast);

    setTimeout(() => {
      toast.classList.add('toast-out');
      toast.addEventListener('animationend', () => {
        toast.remove();
      });
    }, 2500);
  }

  // ==========================================================================
  // テーマ管理
  // ==========================================================================
  const STORAGE_KEY_THEME = 'spla3_app_theme_v1';

  function initTheme() {
    const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'dark';
    applyTheme(savedTheme);
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(nextTheme);
    localStorage.setItem(STORAGE_KEY_THEME, nextTheme);
  }

  function applyTheme(theme) {
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');
    
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      if (themeIcon) themeIcon.innerText = '☀️';
      if (themeLabel) themeLabel.innerText = 'ダークモード';
    } else {
      document.documentElement.removeAttribute('data-theme');
      if (themeIcon) themeIcon.innerText = '🌙';
      if (themeLabel) themeLabel.innerText = 'ライトモード';
    }
  }

  // ==========================================================================
  // 一時バックアップ＆復元（Undo機能）
  // ==========================================================================
  const STORAGE_KEY_UNSAVED_BACKUP = 'spla3_unsaved_backup_v1';

  function backupCurrentEditorState() {
    const backupData = {
      weapon: getWeaponSlotElementData(),
      gear: {
        head: getGearPartData('head'),
        clothes: getGearPartData('clothes'),
        shoes: getGearPartData('shoes')
      },
      sensitivity: {
        gyro: document.getElementById('input-gyro')?.value || "0.0",
        stick: document.getElementById('input-stick')?.value || "0.0"
      },
      memo: document.getElementById('input-memo')?.value || "",
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY_UNSAVED_BACKUP, JSON.stringify(backupData));
  }

  function restoreUnsavedState() {
    const saved = localStorage.getItem(STORAGE_KEY_UNSAVED_BACKUP);
    if (!saved) {
      showToast("⚠️ 復元できる直前のデータがありません");
      return;
    }

    try {
      const data = JSON.parse(saved);

      // ブキの復元
      selectWeapon(data.weapon.name, data.weapon.image, data.weapon.subImage, data.weapon.spImage);

      // ギアの復元
      ['head', 'clothes', 'shoes'].forEach(part => {
        const gPart = data.gear[part];
        selectGear(part, gPart.name, gPart.image, false);
        ['main', 'sub0', 'sub1', 'sub2'].forEach(slot => {
          selectPower(part, slot, gPart[slot].name, gPart[slot].image, false);
        });
      });

      // 感度とメモの復元
      updateSens('gyro', data.sensitivity.gyro);
      updateSens('stick', data.sensitivity.stick);
      const memoInput = document.getElementById('input-memo');
      if (memoInput) memoInput.value = data.memo || "";

      calculateAndRenderGearTotals();
      showToast("↺ 直前の編集状態を復元しました！");
    } catch (e) {
      console.error(e);
      showToast("❌ データの復元に失敗しました");
    }
  }

  // ==========================================================================
  // ストレージ＆お気に入り・マイギア管理
  // ==========================================================================
  const STORAGE_KEY_FAV_GEARS = 'spla3_favorite_gears_v1';
  const STORAGE_KEY_FAV_WEAPONS = 'spla3_favorite_weapons_v1';
  const STORAGE_KEY_CUSTOM_GEAR_POWERS = 'spla3_custom_gear_powers_v1';
  const STORAGE_KEY_RECENT_WEAPONS = 'spla3_recent_weapons_v1';
  const STORAGE_KEY_RECENT_GEARS = 'spla3_recent_gears_v1';
  const STORAGE_KEY_MY_GEARS = 'spla3_my_gears_list_v1';
  
  const MAX_RECENT_COUNT = 12;
  
  let favoriteGears = new Set();
  let favoriteWeapons = new Set();
  let customGearPowers = {};
  
  let recentWeapons = [];
  let recentGears = { head: [], clothes: [], shoes: [] };
  let myGearsList = { head: [], clothes: [], shoes: [] };

  let selectedFilterPower = "";
  let selectedFilterBrand = "";
  let selectedFilterCat = "";
  let selectedFilterSub = "";
  let selectedFilterSp = "";
  let searchQueryText = "";

  let renderQueueList = [];
  let currentRenderedIndex = 0;
  const CHUNK_SIZE = 20;

  function loadFavorites() {
    const savedGears = localStorage.getItem(STORAGE_KEY_FAV_GEARS);
    if (savedGears) { try { favoriteGears = new Set(JSON.parse(savedGears)); } catch(e) { favoriteGears = new Set(); } }
    
    const savedWeapons = localStorage.getItem(STORAGE_KEY_FAV_WEAPONS);
    if (savedWeapons) { try { favoriteWeapons = new Set(JSON.parse(savedWeapons)); } catch(e) { favoriteWeapons = new Set(); } }
    
    const savedCustomGears = localStorage.getItem(STORAGE_KEY_CUSTOM_GEAR_POWERS);
    if (savedCustomGears) { try { customGearPowers = JSON.parse(savedCustomGears); } catch(e) { customGearPowers = {}; } }
    
    const savedRecentWeapons = localStorage.getItem(STORAGE_KEY_RECENT_WEAPONS);
    if (savedRecentWeapons) { try { recentWeapons = JSON.parse(savedRecentWeapons); } catch(e) { recentWeapons = []; } }
    
    const savedRecentGears = localStorage.getItem(STORAGE_KEY_RECENT_GEARS);
    if (savedRecentGears) { try { recentGears = JSON.parse(savedRecentGears); } catch(e) { recentGears = { head: [], clothes: [], shoes: [] }; } }

    const savedMyGears = localStorage.getItem(STORAGE_KEY_MY_GEARS);
    if (savedMyGears) { try { myGearsList = JSON.parse(savedMyGears); } catch(e) { myGearsList = { head: [], clothes: [], shoes: [] }; } }
  }

  function saveCurrentGearAsMyGear(part) {
    const gearSlot = document.getElementById(`slot-${part}`);
    const name = gearSlot?.getAttribute('data-name');
    if (!name || name === '未選択') {
      showToast("❌ ギアが選択されていません。");
      return;
    }

    const mainPower = document.getElementById(`${part}-main`)?.getAttribute('data-name') || "未選択";
    const sub0 = document.getElementById(`${part}-sub0`)?.getAttribute('data-name') || "-";
    const sub1 = document.getElementById(`${part}-sub1`)?.getAttribute('data-name') || "-";
    const sub2 = document.getElementById(`${part}-sub2`)?.getAttribute('data-name') || "-";

    const imageEl = gearSlot.querySelector('.image-placeholder img');
    const image = imageEl ? imageEl.getAttribute('src') : "";

    const newMyGear = {
      id: "mygear_" + Date.now(),
      name: name,
      image: image,
      main: mainPower,
      subs: [sub0, sub1, sub2]
    };

    if (!myGearsList[part]) myGearsList[part] = [];
    myGearsList[part].unshift(newMyGear);
    localStorage.setItem(STORAGE_KEY_MY_GEARS, JSON.stringify(myGearsList));

    showToast(`📦 「${name}」をマイギアに保存しました！`);
  }

  function deleteMyGearItem(part, id, event) {
    if (event) event.stopPropagation();
    if (confirm("⚠️ このマイギアを所持リストから削除しますか？")) {
      if (myGearsList[part]) {
        myGearsList[part] = myGearsList[part].filter(g => g.id !== id);
        localStorage.setItem(STORAGE_KEY_MY_GEARS, JSON.stringify(myGearsList));
        openMyGearModal(part, false);
        showToast("🗑️ マイギアから削除しました");
      }
    }
  }

  function pushRecentWeapon(item) {
    if (!item || !item.name || item.name === "未選択") return;
    recentWeapons = recentWeapons.filter(w => w.name !== item.name);
    recentWeapons.unshift(item);
    if (recentWeapons.length > MAX_RECENT_COUNT) recentWeapons = recentWeapons.slice(0, MAX_RECENT_COUNT);
    localStorage.setItem(STORAGE_KEY_RECENT_WEAPONS, JSON.stringify(recentWeapons));
  }

  function pushRecentGear(part, item) {
    if (!item || !item.name || item.name === "未選択") return;
    if (!recentGears[part]) recentGears[part] = [];
    recentGears[part] = recentGears[part].filter(g => g.name !== item.name);
    recentGears[part].unshift(item);
    if (recentGears[part].length > MAX_RECENT_COUNT) recentGears[part] = recentGears[part].slice(0, MAX_RECENT_COUNT);
    localStorage.setItem(STORAGE_KEY_RECENT_GEARS, JSON.stringify(recentGears));
  }

  function toggleFavoriteGear(gearName, event) {
    if (event) event.stopPropagation();
    if (favoriteGears.has(gearName)) { favoriteGears.delete(gearName); } 
    else { favoriteGears.add(gearName); }
    localStorage.setItem(STORAGE_KEY_FAV_GEARS, JSON.stringify([...favoriteGears]));

    if (currentModalContext.type === 'gearList') { renderGearListItems(currentModalContext.part, currentModalContext.brandIndex); } 
    else if (currentModalContext.type === 'favoriteGearList') { openFavoriteGearModal(currentModalContext.part, false); } 
    else if (currentModalContext.type === 'recentGearList') { openRecentGearModal(currentModalContext.part, false); } 
    else if (currentModalContext.type === 'gearBrand') { renderGearBrandView(currentModalContext.part); }
  }

  function toggleFavoriteWeapon(weaponName, event) {
    if (event) event.stopPropagation();
    if (favoriteWeapons.has(weaponName)) { favoriteWeapons.delete(weaponName); } 
    else { favoriteWeapons.add(weaponName); }
    localStorage.setItem(STORAGE_KEY_FAV_WEAPONS, JSON.stringify([...favoriteWeapons]));

    if (currentModalContext.type === 'weaponList') { openWeaponListModal(currentModalContext.categoryIndex); } 
    else if (currentModalContext.type === 'favoriteWeaponList') { openFavoriteWeaponModal(); } 
    else if (currentModalContext.type === 'recentWeaponList') { openRecentWeaponModal(); } 
    else if (currentModalContext.type === 'weaponCat') { filterModalItems(); }
  }

  let currentModalContext = { type: '', part: '', brandIndex: -1, categoryIndex: -1 };

  const PARTS_ORDER = ['weapon', 'head', 'clothes', 'shoes'];

  function navigateModalPart(direction) {
    let currentPart = 'weapon';
    if (currentModalContext.type.includes('gear') || currentModalContext.type.includes('Gear') || currentModalContext.type.includes('myGear') || currentModalContext.type === 'power') {
      currentPart = currentModalContext.part || 'head';
    }

    let currentIndex = PARTS_ORDER.indexOf(currentPart);
    if (currentIndex === -1) currentIndex = 0;

    let nextIndex = (currentIndex + direction + PARTS_ORDER.length) % PARTS_ORDER.length;
    let nextPart = PARTS_ORDER[nextIndex];

    const modalWin = document.getElementById('modal-window');
    if (modalWin) {
      modalWin.classList.remove('modal-slide-left', 'modal-slide-right');
      void modalWin.offsetWidth;

      if (direction > 0) {
        modalWin.classList.add('modal-slide-left');
      } else {
        modalWin.classList.add('modal-slide-right');
      }
    }

    if (nextPart === 'weapon') { openWeaponCategoryModal(true); } 
    else { openGearBrandModal(nextPart, true); }
  }

  function toggleFilterCollapse(forceOpen = null) {
    const btn = document.getElementById('filter-toggle-btn');
    const wrapper = document.getElementById('filter-collapsible-wrapper');
    if (!btn || !wrapper) return;
    const isOpen = forceOpen !== null ? forceOpen : !wrapper.classList.contains('open');
    if (isOpen) { wrapper.classList.add('open'); btn.classList.add('open'); } 
    else { wrapper.classList.remove('open'); btn.classList.remove('open'); }
  }

  function updateFilterSummaryText() {
    const summaryEl = document.getElementById('filter-summary-text');
    if (!summaryEl) return;
    let selectedList = [];
    if (currentModalContext.type.includes('gear') || currentModalContext.type.includes('Gear') || currentModalContext.type.includes('myGear')) {
      if (selectedFilterBrand) selectedList.push(selectedFilterBrand);
      if (selectedFilterPower) selectedList.push(selectedFilterPower);
    } else {
      if (selectedFilterCat) selectedList.push(selectedFilterCat);
      if (selectedFilterSub) selectedList.push(selectedFilterSub);
      if (selectedFilterSp) selectedList.push(selectedFilterSp);
    }
    summaryEl.innerText = selectedList.length > 0 ? `（${selectedList.join(' / ')}）` : "";
  }

  function renderQuickAccessBar() {
    const bar = document.getElementById('quick-access-bar');
    if (!bar) return;

    const ctx = currentModalContext.type;
    const part = currentModalContext.part;

    if (ctx.includes('weapon') || ctx.includes('Weapon')) {
      bar.innerHTML = `
        <button class="quick-access-btn btn-all ${ctx === 'weaponCat' ? 'active' : ''}" onclick="openWeaponCategoryModal(true)">ALL すべて</button>
        <button class="quick-access-btn btn-fav ${ctx === 'favoriteWeaponList' ? 'active' : ''}" onclick="openFavoriteWeaponModal()">★ お気に入り</button>
        <button class="quick-access-btn btn-recent ${ctx === 'recentWeaponList' ? 'active' : ''}" onclick="openRecentWeaponModal()">🕒 選択履歴</button>
      `;
    } else if (ctx.includes('gear') || ctx.includes('Gear') || ctx.includes('myGear')) {
      bar.innerHTML = `
        <button class="quick-access-btn btn-all ${ctx === 'gearBrand' ? 'active' : ''}" onclick="openGearBrandModal('${part}', true)">ALL すべて</button>
        <button class="quick-access-btn btn-mygear ${ctx === 'myGearList' ? 'active' : ''}" onclick="openMyGearModal('${part}', false)">📦 マイギア</button>
        <button class="quick-access-btn btn-fav ${ctx === 'favoriteGearList' ? 'active' : ''}" onclick="openFavoriteGearModal('${part}', false)">★ お気に入り</button>
        <button class="quick-access-btn btn-recent ${ctx === 'recentGearList' ? 'active' : ''}" onclick="openRecentGearModal('${part}', false)">🕒 選択履歴</button>
      `;
    } else {
      bar.innerHTML = "";
    }
  }

  function triggerContentFadeIn() {
    const content = document.getElementById('modal-window-content');
    if (!content) return;

    content.classList.remove('content-fade-in');
    void content.offsetWidth;
    content.classList.add('content-fade-in');
  }

  function showModal() {
    const modal = document.getElementById('selection-modal');
    const modalWin = document.getElementById('modal-window');
    const scrollContainer = document.getElementById('modal-scroll-body');
    
    modal.style.display = "flex";
    document.body.classList.add('no-scroll');

    if (modalWin && !modalWin.classList.contains('modal-slide-left') && !modalWin.classList.contains('modal-slide-right')) {
      triggerContentFadeIn();
    }

    if (scrollContainer) {
      scrollContainer.scrollTop = 0;
      requestAnimationFrame(() => { scrollContainer.scrollTop = 0; });
    }
  }

  function setupLazyRender(itemList, renderFn, clearGrid = true) {
    renderQueueList = itemList;
    currentRenderedIndex = 0;
    if (clearGrid) gridContent.innerHTML = "";

    renderNextChunk(renderFn);
  }

  function renderNextChunk(renderFn) {
    if (currentRenderedIndex >= renderQueueList.length) return;
    const nextBatch = renderQueueList.slice(currentRenderedIndex, currentRenderedIndex + CHUNK_SIZE);
    currentRenderedIndex += CHUNK_SIZE;
    const fragment = document.createDocumentFragment();
    nextBatch.forEach(item => {
      const htmlStr = renderFn(item);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlStr.trim();
      if (tempDiv.firstChild) fragment.appendChild(tempDiv.firstChild);
    });
    gridContent.appendChild(fragment);
  }

  function initModalScrollListener() {
    const scrollContainer = document.getElementById('modal-scroll-body');
    if (!scrollContainer) return;
    scrollContainer.addEventListener('scroll', () => {
      if (scrollContainer.scrollTop + scrollContainer.clientHeight >= scrollContainer.scrollHeight - 150) {
        if (currentModalContext.type.includes('weapon') || currentModalContext.type.includes('Weapon')) {
          renderNextChunk(createWeaponTileHTML);
        } else if (currentModalContext.type.includes('gear') || currentModalContext.type.includes('Gear') || currentModalContext.type.includes('myGear')) {
          renderNextChunk(createGearTileHTML);
        }
      }
    });
  }

  function resetSearchInput() {
    searchQueryText = "";
    const searchInput = document.getElementById('modal-search-text');
    if (searchInput) searchInput.value = "";
  }

  function onSearchTextChange() {
    const searchInput = document.getElementById('modal-search-text');
    if (searchInput) {
      searchQueryText = searchInput.value.trim().toLowerCase();
      filterModalItems();
    }
  }

  // ==========================================================================
  // マスタデータ
  // ==========================================================================
  const weaponCategoryList = [
    {
      category: "シューター", 
      image: "ブキ種/シューター.webp",
      weapons: [
        { image: "ブキ/ボールドマーカー.png", name: "ボールドマーカー", subImage: "サブスぺ/カーリングボム.png", spImage: "サブスぺ/ウルトラハンコ.png" }, 
        { image: "ブキ/ボールドマーカーネオ.png", name: "ボールドマーカーネオ", subImage: "サブスぺ/ジャンプビーコン.png", spImage: "サブスぺ/メガホンレーザー5.1ch.png" }, 
        { image: "ブキ/プロモデラーMG.png", name: "プロモデラーMG", subImage: "サブスぺ/タンサンボム.png", spImage: "サブスぺ/サメライド.png" },  
        { image: "ブキ/プロモデラーRG.png", name: "プロモデラーRG", subImage: "サブスぺ/スプリンクラー.png", spImage: "サブスぺ/ナイスダマ.png" },   
        { image: "ブキ/プロモデラー彩.png", name: "プロモデラー彩", subImage: "サブスぺ/クイックボム.png", spImage: "サブスぺ/スミナガシート.png" },   
        { image: "ブキ/わかばシューター.png", name: "わかばシューター", subImage: "サブスぺ/スプラッシュボム.png", spImage: "サブスぺ/グレートバリア.png" },  
        { image: "ブキ/もみじシューター.png", name: "もみじシューター", subImage: "サブスぺ/トーピード.png", spImage: "サブスぺ/ホップソナー.png" },  
        { image: "ブキ/シャープマーカー.png", name: "シャープマーカー", subImage: "サブスぺ/クイックボム.png", spImage: "サブスぺ/カニタンク.png" },

  function extractNameFromPath(path) {
    if (!path) return '';
    const filename = path.split('/').pop();
    return filename.replace(/\.[^/.]+$/, "");
  }

  function getPowerImagePath(part, powerName) {
    if (!powerName || powerName === "未選択" || powerName === "-") return "";
    const allPowers = [...gearListNormal, ...(gearListLeft[part] || [])];
    const found = allPowers.find(p => p.name === powerName);
    return found ? found.image : "";
  }

  function getGearBrandName(part, gearName) {
    if (gearBrandList[part]) {
      for (let b of gearBrandList[part]) {
        if (b.items.some(i => i.name === gearName)) return b.brand;
      }
    }
    return "";
  }

  function initFilterSelects() {
    const catsMap = new Map();
    const subsMap = new Map();
    const spsMap = new Map();

    weaponCategoryList.forEach(cat => {
      if (cat.category && !catsMap.has(cat.category)) catsMap.set(cat.category, cat.image);
      cat.weapons.forEach(w => {
        const subName = extractNameFromPath(w.subImage);
        const spName = extractNameFromPath(w.spImage);
        if (subName && !subsMap.has(subName)) subsMap.set(subName, w.subImage);
        if (spName && !spsMap.has(spName)) spsMap.set(spName, w.spImage);
      });
    });

    filterCatBar.innerHTML = `<div class="power-filter-btn ${selectedFilterCat === "" ? "active" : ""}" onclick="selectFilterCat('')" title="すべて">ALL</div>`;
    catsMap.forEach((img, name) => {
      filterCatBar.innerHTML += `<div class="power-filter-btn ${selectedFilterCat === name ? "active" : ""}" onclick="selectFilterCat('${name}')" title="${name}"><img src="${img}" alt="${name}"></div>`;
    });

    filterSubBar.innerHTML = `<div class="power-filter-btn ${selectedFilterSub === "" ? "active" : ""}" onclick="selectFilterSub('')" title="すべて">ALL</div>`;
    subsMap.forEach((img, name) => {
      filterSubBar.innerHTML += `<div class="power-filter-btn ${selectedFilterSub === name ? "active" : ""}" onclick="selectFilterSub('${name}')" title="${name}"><img src="${img}" alt="${name}"></div>`;
    });

    filterSpBar.innerHTML = `<div class="power-filter-btn ${selectedFilterSp === "" ? "active" : ""}" onclick="selectFilterSp('')" title="すべて">ALL</div>`;
    spsMap.forEach((img, name) => {

  }

  function filterModalItems() {
    if (currentModalContext.type.includes('gear') || currentModalContext.type.includes('Gear') || currentModalContext.type.includes('myGear')) {
      if (currentModalContext.type === 'gearBrand') { renderGearBrandView(currentModalContext.part); } 
      else if (currentModalContext.type === 'favoriteGearList') { openFavoriteGearModal(currentModalContext.part, false); } 
      else if (currentModalContext.type === 'recentGearList') { openRecentGearModal(currentModalContext.part, false); } 
      else if (currentModalContext.type === 'myGearList') { openMyGearModal(currentModalContext.part, false); }
      else { renderGearListItems(currentModalContext.part, currentModalContext.brandIndex); }
      return;
    }

    let targetWeapons = [];
    if (currentModalContext.type === 'recentWeaponList') { targetWeapons = [...recentWeapons]; } 
    else {
      weaponCategoryList.forEach(cat => {
        if (!selectedFilterCat || cat.category === selectedFilterCat) {
          cat.weapons.forEach(w => {
            if (currentModalContext.type === 'favoriteWeaponList') { if (favoriteWeapons.has(w.name)) targetWeapons.push(w); } 
            else { targetWeapons.push(w); }
          });
        }
      });
    }

    const filtered = targetWeapons.filter(w => {
      const subName = extractNameFromPath(w.subImage);
      const spName = extractNameFromPath(w.spImage);
      const matchSub = (!selectedFilterSub || subName === selectedFilterSub);
      const matchSp = (!selectedFilterSp || spName === selectedFilterSp);
      const matchText = (!searchQueryText || w.name.toLowerCase().includes(searchQueryText));
      return matchSub && matchSp && matchText;
    });

    renderWeaponGrid(filtered);
  }

  function selectGear(part, name, imagePath, autoLoadCustom = true) {
    const slot = document.getElementById(`slot-${part}`);
    slot.setAttribute('data-name', name);
    const nameEl = document.getElementById(`display-${part}-name`); nameEl.innerText = name;
    
    if(name === "未選択" || !imagePath) {
      document.getElementById(`display-${part}-icon`).innerText = "?";
      nameEl.classList.remove('active-selection');
    } else {
      document.getElementById(`display-${part}-icon`).innerHTML = `<img src="${imagePath}">`;
      nameEl.classList.add('active-selection');
      pushRecentGear(part, { name, image: imagePath });
    }

    if (autoLoadCustom) {
      // --- 現在選択されているギアパワーを取得 ---
      const currentMainName = document.getElementById(`${part}-main`)?.getAttribute('data-name');
      const currentSub0Name = document.getElementById(`${part}-sub0`)?.getAttribute('data-name');
      const currentSub1Name = document.getElementById(`${part}-sub1`)?.getAttribute('data-name');
      const currentSub2Name = document.getElementById(`${part}-sub2`)?.getAttribute('data-name');

      // メインまたはサブのいずれかが選択済み（未選択/'?'/'-' 以外）かを判定
      const hasExistingMain = currentMainName && currentMainName !== "未選択" && currentMainName !== "?";
      const hasExistingSubs = (currentSub0Name && currentSub0Name !== "未選択" && currentSub0Name !== "-") ||
                               (currentSub1Name && currentSub1Name !== "未選択" && currentSub1Name !== "-") ||
                               (currentSub2Name && currentSub2Name !== "未選択" && currentSub2Name !== "-");

      // すでに何らかのギアパワーが選択されている場合は既存の構成を優先して保持する
      if (!hasExistingMain && !hasExistingSubs) {
        let defaultMain = ""; let defaultSubs = ["-", "-", "-"];
        if (gearBrandList[part]) {
          for (let b of gearBrandList[part]) {
            let item = b.items.find(i => i.name === name);
            if (item) { defaultMain = item.defaultMain || ""; defaultSubs = item.defaultSubs || ["-", "-", "-"]; break; }
          }
        }
        const savedPow = customGearPowers[name] || { main: defaultMain, subs: defaultSubs };
        if (savedPow.main) {
          const foundMain = [...gearListNormal, ...gearListLeft[part]].find(p => p.name === savedPow.main);
          selectPower(part, 'main', savedPow.main, foundMain ? foundMain.image : "", false);
        } else { selectPower(part, 'main', '未選択', '', false); }

        for (let i = 0; i < 3; i++) {
          const sName = (savedPow.subs && savedPow.subs[i]) ? savedPow.subs[i] : "-";
          const foundSub = gearListNormal.find(p => p.name === sName);
          selectPower(part, `sub${i}`, sName, foundSub ? foundSub.image : "", false);
        }
      }
    }

    closeModal();
    calculateAndRenderGearTotals();
  }

    else { targetSlot.innerHTML = `<img src="${imagePath}">`; }

  function calculateAndRenderGearTotals() {
    const totalsContainer = document.getElementById('gear-totals-wrapper');
    if (!totalsContainer) return;
    const parts = ['head', 'clothes', 'shoes']; const powerMap = {};
    const clothesMainEl = document.getElementById('clothes-main');
    const isDoubled = clothesMainEl && clothesMainEl.getAttribute('data-name') === '倍化';

    parts.forEach(part => {
      const mainEl = document.getElementById(`${part}-main`);
      if (mainEl) {
        const mName = mainEl.getAttribute('data-name');
        const mImg = mainEl.querySelector('img')?.getAttribute('src');
        if (mName && mName !== '未選択' && mName !== '?' && mImg) {
          if (!powerMap[mName]) powerMap[mName] = { total: 0, image: mImg };
          powerMap[mName].total += 1.0;
        }
      }
      for (let i = 0; i < 3; i++) {
        const subEl = document.getElementById(`${part}-sub${i}`);
        if (subEl) {
          const sName = subEl.getAttribute('data-name');
          const sImg = subEl.querySelector('img')?.getAttribute('src');
          if (sName && sName !== '未選択' && sName !== '-' && sImg) {
            if (!powerMap[sName]) powerMap[sName] = { total: 0, image: sImg };
            powerMap[sName].total += (part === 'clothes' && isDoubled) ? 0.6 : 0.3;
          }
        }
      }
    });

    const powerNames = Object.keys(powerMap);
    if (powerNames.length === 0) { totalsContainer.innerHTML = `<span class="empty-totals-msg">ギアパワーが選択されていません</span>`; return; }
    let html = '';
    powerNames.forEach(pName => {
      const item = powerMap[pName];
      const formattedValue = (Math.round(item.total * 10) / 10).toFixed(1);
      html += `<div class="gear-total-item" title="${pName}: ${formattedValue}"><div class="gear-total-icon"><img src="${item.image}"></div><div class="gear-total-value">${formattedValue}</div></div>`;
    });
    totalsContainer.innerHTML = html;
  }

  function exportAsImage() {
    const target = document.getElementById('capture-target'); if (!target) return;
    const btn = document.querySelector('.export-img-btn'); const originalText = btn ? btn.innerText : '';
    if (btn) btn.innerText = "生成中...";

      document.body.appendChild(clone);

      html2canvas(clone, { backgroundColor: computedBg, scale: 2, useCORS: true, logging: false, windowWidth: 1200 }).then(canvas => {
        document.body.removeChild(clone);
        const fileName = `${slotNames[currentActiveSlotKey] || 'マイコーデ'}.png`;

      });
    });
  }

  function handleJSONFileSelect(event) {

      try {
        const importedData = JSON.parse(e.target.result);

          showToast("❌ 無効なバックアップデータです");
          return;

        if (confirm("⚠️ 現在登録されているコーデデータが上書きされます。インポートを続行しますか？")) {
          slotNames = importedData.slotNames || {};
          slotsData = importedData.slotsData || {};
          favoriteGears = new Set(importedData.favoriteGears || []);
          favoriteWeapons = new Set(importedData.favoriteWeapons || []);
          customGearPowers = importedData.customGearPowers || {};
          myGearsList = importedData.myGearsList || { head: [], clothes: [], shoes: [] };
          recentWeapons = importedData.recentWeapons || [];
          recentGears = importedData.recentGears || { head: [], clothes: [], shoes: [] };

          saveAllToStorage();
          localStorage.setItem(STORAGE_KEY_FAV_GEARS, JSON.stringify([...favoriteGears]));
          localStorage.setItem(STORAGE_KEY_FAV_WEAPONS, JSON.stringify([...favoriteWeapons]));
          localStorage.setItem(STORAGE_KEY_CUSTOM_GEAR_POWERS, JSON.stringify(customGearPowers));
          localStorage.setItem(STORAGE_KEY_MY_GEARS, JSON.stringify(myGearsList));
          localStorage.setItem(STORAGE_KEY_RECENT_WEAPONS, JSON.stringify(recentWeapons));
          localStorage.setItem(STORAGE_KEY_RECENT_GEARS, JSON.stringify(recentGears));

          const firstKey = Object.keys(slotNames)[0];
          if (firstKey) {
            switchSlot(firstKey);
          } else {
            renderVisualSlots();
            clearCurrentEditor();
          }

          showToast("🎉 バックアップを読み込みました！");

      } catch (err) {
        console.error(err);
        showToast("❌ ファイルの読み込みに失敗しました");
      }
      event.target.value = "";
    };
    reader.readAsText(file);

  function initSensMeters() {
    ['gyro', 'stick'].forEach(type => {
      const container = document.getElementById(`blocks-${type}`); container.innerHTML = "";
      for (let i = 0; i < 21; i++) {
